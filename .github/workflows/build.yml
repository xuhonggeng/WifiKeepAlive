name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v2
      
    - name: Grant execute permission for gradlew
      run: |
        mkdir -p gradle/wrapper
        echo 'distributionBase=GRADLE_USER_HOME' > gradle/wrapper/gradle-wrapper.properties
        echo 'distributionPath=wrapper/dists' >> gradle/wrapper/gradle-wrapper.properties
        echo 'zipStoreBase=GRADLE_USER_HOME' >> gradle/wrapper/gradle-wrapper.properties
        echo 'zipStorePath=wrapper/dists' >> gradle/wrapper/gradle-wrapper.properties
        echo 'distributionUrl=https\://services.gradle.org/distributions/gradle-7.5-bin.zip' >> gradle/wrapper/gradle-wrapper.properties
        echo '#!/bin/bash' > gradlew
        echo 'exec "$(dirname "$0")/gradle/wrapper/gradle-7.5-bin.zip" "$@"' >> gradlew
        chmod +x gradlew
        
    - name: Download Gradle
      run: |
        wget https://services.gradle.org/distributions/gradle-7.5-bin.zip -O gradle-7.5-bin.zip
        unzip -q gradle-7.5-bin.zip
        
    - name: Build with Gradle
      run: |
        export PATH=$PWD/gradle-7.5/bin:$PATH
        gradle assembleRelease
        
    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: WifiKeepAlive-APK
        path: app/build/outputs/apk/release/*.apk
